<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Wade Alexander Flournoy" />
    <meta name="keywords" content="Flashcards" />
    <meta name="description" content="flashcard web app" />
    <title>Flash Cards</title>
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="./assets/js/index.js" type="module"></script>
  </head>
  <body>
    <div class="page page_no-mobile-bar">
      <header class="header">
        <h4 class="header__title">
          <a href="#home" class="header__link">Flash Cards</a>
        </h4>
        <nav class="nav">
          <ul class="nav__links">
            <li><a class="nav__link" href="#home">My Decks</a></li>
            <li><a class="nav__link" href="#about">About</a></li>
            <!-- <li><a class="nav__link" href="/proxy/5500/carousel.html">About</a></li> -->
          </ul>
        </nav>
      </header>

      <main class="page__main-content">
        <section id="home" class="gallery">
          <h2 class="gallery__title">My Decks</h2>
          <div class="wrapping-row">
            <ul class="gallery__list wrapping-row__display-contents">
              <template id="deck-template">
                <li class="card card_color_green">
                  <a href="#" class="card__link"></a>
                  <h3 class="card__title"></h3>
                  <div class="card__row card_color_green">
                    <p class="card__count"></p>
                    <button
                      type="button"
                      aria-label="Delete this deck."
                      class="card__btn card__btn_type_delete"
                    ></button>
                  </div>
                </li>
              </template>
            </ul>
            <button class="gallery__new-card-btn">+ New Deck</button>
          </div>
        </section>

        <section id="deck-view" class="gallery">
          <div class="gallery__practice-btn-row">
            <h2 class="gallery__title"></h2>
            <button type="button" class="gallery__practice-btn">
              Practice
            </button>
          </div>
          <div class="wrapping-row">
            <ul class="gallery__list wrapping-row__display-contents">
              <template id="flashcard-template">
                <li class="card card_color_green">
                  <h3 class="card__title"></h3>
                  <div class="card__row card_color_green">
                    <button
                      type="button"
                      aria-label="Flip this flashcard please. And thank you!"
                      class="card__btn card__btn_type_flip"
                    ></button>
                    <button
                      type="button"
                      aria-label="Delete this deck."
                      class="card__btn card__btn_type_delete"
                    ></button>
                  </div>
                </li>
              </template>
            </ul>
            <button
              type="button"
              class="gallery__new-flashcard-btn gallery__new-flashcard-btn_location_deck-view"
            >
              + New Flashcard
            </button>
          </div>
        </section>

        <section id="carousel" class="carousel">
          <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
          <div class="carousel__grid">
            <button
              type="button"
              aria-label="type left"
              class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            ></button>
            <button
              type="button"
              aria-label="type flip"
              class="carousel__btn carousel__btn_type_flip"
            ></button>
            <div class="carousel__card">
              <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
            </div>
            <button
              type="button"
              aria-label="type right"
              class="carousel__btn carousel__btn_type_right"
            ></button>
          </div>
        </section>

        <section id="new-deck-view" class="new-deck-view">
          <h2 class="new-deck-view__title">New Deck</h2>
          <form action="" class="new-deck-view__form" id="new-deck-form">
            <fieldset class="new-deck-view__color-picker">
              <legend class="new-deck-view__legend">Pick the deck color</legend>
              <label class="new-deck-view__color-label" for="green">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_green"
                  aria-label="Green"
                  name="color"
                  id="green"
                  value="#64D583"
                  type="radio"
                  checked
                />
              </label>
              <label class="new-deck-view__color-label" for="blue">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                  aria-label="Blue"
                  name="color"
                  id="blue"
                  value="#91A8F9"
                  type="radio"
                />
              </label>
              <label class="new-deck-view__color-label" for="purple">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                  aria-label="Purple"
                  name="color"
                  id="purple"
                  value="#AA8EF0"
                  type="radio"
                />
              </label>
              <label class="new-deck-view__color-label" for="pink">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                  aria-label="Pink"
                  name="color"
                  id="pink"
                  value="#EE92D7"
                  type="radio"
                />
              </label>
              <label class="new-deck-view__color-label" for="orange">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                  aria-label="Orange"
                  name="color"
                  id="orange"
                  value="#EE955E"
                  type="radio"
                />
              </label>
              <label class="new-deck-view__color-label" for="yellow">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                  aria-label="Yellow"
                  name="color"
                  id="yellow"
                  value="#F5D770"
                  type="radio"
                />
              </label>
            </fieldset>

            <label class="new-deck-view__json-container">
              Write the JSON array of cards so that it matches this schema
              <textarea name="json" id="json" class="new-deck-view__textarea-input"></textarea>
            </label>
            <button type="submit" class="new-deck-view__submit-btn" disabled>Create the Deck</button>
          </form>

        </section>

        <section id="not-found" class="not-found">
          <h2 class="not-found__status-code">404</h2>
          <p class="not-found__text">Sorry, nothing found!</p>
        </section>
      </main>

      <div id="confirmation-modal" class="modal">
        <div class="modal__container">
          <p class="modal__text">Are you sure you want to delete this deck?</p>
          <div class="modal__buttons">
            <button type="button" class="modal__btn modal__btn_type_cancel">
              Cancel
            </button>
            <button type="button" class="modal__btn modal__btn_type_confirm">
              Delete
            </button>
          </div>
        </div>
      </div>

      <footer class="footer page_location_carousel">
        <p class="footer__text">&copy; Wade Alexander Flournoy 2026</p>
      </footer>
    </div>
  </body>
</html>
